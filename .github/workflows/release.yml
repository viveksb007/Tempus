name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build
        run: |
          xcodebuild -project Tempus.xcodeproj \
            -scheme Tempus \
            -configuration Release \
            -derivedDataPath build \
            -destination 'platform=macOS' \
            build

      - name: Create Archive
        run: |
          cd build/Build/Products/Release
          zip -r Tempus.zip Tempus.app
          mv Tempus.zip $GITHUB_WORKSPACE/

      - name: Calculate SHA256
        id: sha256
        run: |
          SHA=$(shasum -a 256 Tempus.zip | awk '{print $1}')
          echo "sha256=$SHA" >> $GITHUB_OUTPUT
          echo "SHA256: $SHA"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: Tempus.zip
          body: |
            ## Installation

            ### Via Homebrew
            ```bash
            brew tap viveksb007/tap
            brew install --cask tempus
            ```

            ### Manual Installation
            1. Download `Tempus.zip`
            2. Extract and move `Tempus.app` to `/Applications`

            **SHA256:** `${{ steps.sha256.outputs.sha256 }}`
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Homebrew Cask
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          SHA256=${{ steps.sha256.outputs.sha256 }}

          git clone https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/viveksb007/homebrew-tap.git
          cd homebrew-tap

          mkdir -p Casks

          cat > Casks/tempus.rb << CASK
          cask "tempus" do
            version "${VERSION}"
            sha256 "${SHA256}"

            url "https://github.com/viveksb007/Tempus/releases/download/v${VERSION}/Tempus.zip"
            name "Tempus"
            desc "macOS menu bar app showing Month, Year, and Life progress as percentages"
            homepage "https://github.com/viveksb007/Tempus"

            app "Tempus.app"

            zap trash: [
              "~/Library/Preferences/com.tempus.app.plist",
            ]
          end
          CASK

          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add Casks/tempus.rb
          git commit -m "Update tempus cask to v${VERSION}"
          git push
